<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recytron Elite - ODS 12</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --v-bosque: #1b4332; --v-eco: #2d6a4f; --v-menta: #95d5b2;
            --amarillo-ods: #ffb703; --rojo: #e63946; --neon: #39ff14;
        }

        body { 
            font-family: 'Quicksand', sans-serif; margin: 0; overflow: hidden;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center;
        }

        .leaf { position: absolute; top: -50px; z-index: 1; pointer-events: none; font-size: 24px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        .particle { position: absolute; pointer-events: none; z-index: 300; border-radius: 50%; animation: explode 1s ease-out forwards; }
        @keyframes explode { 0% { transform: translate(0,0) scale(1); opacity:1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity:0; } }

        #big-announcer {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: white; padding: 50px; border-radius: 40px; border: 8px solid var(--amarillo-ods);
            z-index: 500; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.5); 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #big-announcer.show { transform: translate(-50%, -50%) scale(1); }

        .card { 
            background: rgba(255, 255, 255, 0.9); padding: 2.5rem; border-radius: 40px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 90%; max-width: 480px; 
            text-align: center; backdrop-filter: blur(10px); border: 4px solid var(--v-menta); position: relative; z-index: 10;
        }

        button { 
            background: var(--v-eco); color: white; border: none; padding: 15px;
            border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%;
            margin-top: 10px; transition: 0.3s; font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 10px var(--neon); box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }
        button:hover:not(:disabled) { transform: scale(1.02); }
        button.oro { background: var(--amarillo-ods); color: black; }

        .wheel-container { position: relative; width: 280px; height: 280px; margin: 20px auto; }
        #wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 6px solid white;
            position: relative; transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            background: conic-gradient(
                #2d6a4f 0 36deg, #1b4332 36deg 72deg, #2d6a4f 72deg 108deg, #1b4332 108deg 144deg,
                #2d6a4f 144deg 180deg, #1b4332 180deg 216deg, #2d6a4f 216deg 252deg, #1b4332 252deg 288deg,
                #2d6a4f 288deg 324deg, var(--amarillo-ods) 324deg 360deg
            );
        }
        .w-txt {
            position: absolute; width: 50%; top: 50%; left: 50%; transform-origin: left center;
            color: white; font-size: 9px; font-weight: bold; text-align: right; padding-right: 15px;
        }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--rojo); z-index: 20; }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .hidden { display: none !important; }
        .scroll { max-height: 200px; overflow-y: auto; background: #f0f0f0; border-radius: 15px; padding: 10px; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="big-announcer">
        <h2 style="margin:0; color:var(--v-bosque)">¡ENHORABUENA!</h2>
        <h1 id="prize-display" style="font-size: 2.5rem; color:var(--v-eco); margin: 20px 0;">PREMIO</h1>
        <button onclick="closePrize()" class="oro">RECOGER RECOMPENSA</button>
    </div>

    <div id="view-login" class="card">
        <h1 style="color:var(--v-bosque)">RECYTRON 🌿</h1>
        <p style="font-size: 0.8rem;">CONEXIÓN NUBE ACTIVADA</p>
        <input type="text" id="uIn" placeholder="ID de Usuario (ej: u1)">
        <input type="password" id="pIn" placeholder="Contraseña">
        <button onclick="entrar()">ENTRAR (DESDE NUBE)</button>
    </div>

    <div id="view-dash" class="card hidden">
        <div style="background:var(--v-bosque); color:white; padding:10px; border-radius:15px; margin-bottom:15px; display:flex; justify-content:space-around;">
            <b>👤 <span id="uName"></span></b>
            <b style="color:var(--v-menta)">💎 <span id="uPts">0</span> EP</b>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-bottom:15px;">
            <button onclick="tab('shop')" style="font-size:0.7rem">TIENDA</button>
            <button onclick="tab('spin')" class="oro" style="font-size:0.7rem">RULETA</button>
            <button onclick="tab('inv')" style="font-size:0.7rem">MIS COSAS</button>
        </div>

        <div id="t-shop">
            <h3 style="margin-top:0">Eco-Tienda</h3>
            <div id="shop-list" class="scroll"></div>
        </div>

        <div id="t-spin" class="hidden">
            <div class="wheel-container" id="wheel-anchor">
                <div class="pointer"></div>
                <div id="wheel"></div>
            </div>
            <button id="btnSpin" class="oro" onclick="girar()">GIRAR (50 EP)</button>
        </div>

        <div id="t-inv" class="hidden">
            <h3 style="margin-top:0">Inventario</h3>
            <div id="inv-list" class="scroll"></div>
        </div>

        <button onclick="toggleMusic()" id="btnMusica" style="background:#555; font-size:0.6rem;">🎵 MÚSICA: OFF</button>
        <button onclick="location.reload()" style="background:var(--rojo); margin-top:20px; font-size:0.7rem;">CERRAR SESIÓN</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        // CONFIGURACIÓN DE TU PROYECTO FIREBASE
        const firebaseConfig = {
            databaseURL: "https://recytron-default-rtdb.europe-west1.firebasedatabase.app/" // <--- PEGA TU URL DE FIREBASE AQUÍ
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Variables Globales
        window.user = null;
        let rot = 0;
        const tienda = [
            { n: "🏷️ Pegatina", c: 80 }, 
            { n: "🎒 Bolsa Biodegradable", c: 150 },
            { n: "🔘 Chapa", c: 100 }
        ];
        const premios = [
            { t: "NADA 🍃", win: 0 }, { t: "DTO. 20% 🎫", win: 1 },
            { t: "NADA 🍂", win: 0 }, { t: "PEGATINA 🏷️", win: 1 },
            { t: "NADA 🍃", win: 0 }, { t: "ZUMO ECO 🥤", win: 1 },
            { t: "NADA 🍂", win: 0 }, { t: "CAMISETA 👕", win: 1 },
            { t: "NADA 🍃", win: 0 }, { t: "💎 +100 PTS", win: 1, pts: 100 }
        ];

        // Inicializar Ruleta
        const w = document.getElementById('wheel');
        premios.forEach((p, i) => {
            const d = document.createElement('div');
            d.className = 'w-txt'; d.style.transform = `rotate(${i * 36 + 18}deg)`;
            d.innerText = p.t; w.appendChild(d);
        });

        // LOGIN DESDE FIREBASE (Sin cables)
        window.entrar = function() {
            const uId = document.getElementById('uIn').value;
            const passIn = document.getElementById('pIn').value;

            // Escuchar la nube para este usuario
            const userRef = ref(db, 'usuarios/' + uId);
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.pass === passIn) {
                    window.user = data;
                    window.user.id = uId;
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-dash').classList.remove('hidden');
                    document.getElementById('uName').innerText = uId.toUpperCase();
                    updUI();
                    renderTienda();
                } else {
                    alert("ID o Password incorrectos en la nube");
                }
            });
        };

        function updUI() {
            document.getElementById('uPts').innerText = window.user.pts;
            const list = document.getElementById('inv-list');
            list.innerHTML = (window.user.inv && window.user.inv.length) 
                ? window.user.inv.map(i => `<div style="padding:5px; border-bottom:1px solid #ccc">✅ ${i}</div>`).join('') 
                : 'Vacío';
        }

        // GUARDAR EN LA NUBE (Cuando la web cambia algo)
        function syncNube() {
            set(ref(db, 'usuarios/' + window.user.id), window.user);
        }

        window.comprar = function(c, n) {
            if(window.user.pts >= c) {
                window.user.pts -= c;
                if(!window.user.inv) window.user.inv = [];
                window.user.inv.unshift(n);
                syncNube(); // Se envía a la máquina también
            } else { alert("Sin puntos"); }
        };

        window.girar = function() {
            if(window.user.pts < 50) return;
            window.user.pts -= 50; syncNube();
            const btn = document.getElementById('btnSpin'); btn.disabled = true;
            rot += (360 * 5) + Math.floor(Math.random() * 360);
            w.style.transform = `rotate(${rot}deg)`;

            setTimeout(() => {
                btn.disabled = false;
                const idx = Math.floor(((360 - (rot % 360)) % 360) / 36);
                const p = premios[idx];
                if(p.win) {
                    if(p.pts) window.user.pts += p.pts; 
                    else {
                        if(!window.user.inv) window.user.inv = [];
                        window.user.inv.unshift(p.t);
                    }
                    document.getElementById('prize-display').innerText = p.t;
                    document.getElementById('big-announcer').classList.add('show');
                } else {
                    document.getElementById('prize-display').innerText = "¡MALA SUERTE! 🍃";
                    document.getElementById('big-announcer').classList.add('show');
                }
                syncNube();
            }, 5000);
        };
    </script>

    <script>
        function tab(t) {
            ['shop','spin','inv'].forEach(x => document.getElementById('t-'+x).classList.add('hidden'));
            document.getElementById('t-'+t).classList.remove('hidden');
        }

        function renderTienda() {
            const list = document.getElementById('shop-list');
            const tienda = [
                { n: "🏷️ Pegatina", c: 80 }, 
                { n: "🎒 Bolsa Biodegradable", c: 150 }, 
                { n: "🔘 Chapa", c: 100 }
            ];
            list.innerHTML = tienda.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span>${i.n} (${i.c} EP)</span>
                    <button onclick="comprar(${i.c}, '${i.n}')" style="width:60px; padding:5px; margin:0; font-size:0.6rem">OK</button>
                </div>
            `).join('');
        }

        function closePrize() { document.getElementById('big-announcer').classList.remove('show'); }

        function toggleMusic() {
            const m = document.getElementById('bgMusic');
            const b = document.getElementById('btnMusica');
            if (m.paused) { m.play(); b.innerText = "🔇 MÚSICA: ON"; }
            else { m.pause(); b.innerText = "🎵 MÚSICA: OFF"; }
        }

        setInterval(() => {
            const l = document.createElement('div'); l.className = 'leaf'; l.innerHTML = '🍃';
            l.style.left = Math.random()*100+'vw'; l.style.animationDuration = Math.random()*3+2+'s';
            document.body.appendChild(l); setTimeout(() => l.remove(), 5000);
        }, 500);
    </script>
</body>
</html>
